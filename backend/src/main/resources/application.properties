spring.application.name=zyven
spring.config.import=optional:file:${user.home}/.config/zyven/segredos.properties
server.port=8080
server.forward-headers-strategy=framework
server.servlet.session.cookie.name=ZYVEN_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=strict

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/zyven}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:zyven}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:zyven}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-migration-naming=true

spring.jackson.default-property-inclusion=non_null

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
