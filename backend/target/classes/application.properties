spring.application.name=zyven
spring.config.import=optional:file:${user.home}/.config/zyven/segredos.properties
server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5432/zyven
spring.datasource.username=zyven
spring.datasource.password=zyven
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-migration-naming=true

spring.jackson.default-property-inclusion=non_null
