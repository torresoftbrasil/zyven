name: ${APP_SLUG:?Defina APP_SLUG no .env}

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:?}
      POSTGRES_USER: ${DB_USERNAME:?}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?}
    volumes:
      - /srv/torresoft-data/${APP_SLUG}/postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [zyven_net]

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${DB_NAME:?}
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:?}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?}
      GEMINI_API_KEY: ${GEMINI_API_KEY:?}
      ZYVEN_SESSION_COOKIE_SECURE: "true"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks: [zyven_net]

  gateway:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    restart: unless-stopped
    ports:
      - 127.0.0.1:${HTTP_PORT:?}:80
    depends_on:
      backend:
        condition: service_healthy
    networks: [zyven_net]

networks:
  zyven_net:
    name: ${APP_SLUG}_net
